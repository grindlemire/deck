# Publishes the talks to GitHub Pages on every push to main, as a static
# site: the decks, their link previews and the list of talks, without the
# speaker notes or the follow-along (see README.md here).
#
# Copy this file to .github/workflows/pages.yml in your talks repo, then
# in the repo's Settings > Pages, set Source to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: pages
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile --production
      # base_url is where Pages serves the site (https://you.github.io/repo),
      # for the link previews' absolute URLs.
      - run: bun deck publish --static --out site --base "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
